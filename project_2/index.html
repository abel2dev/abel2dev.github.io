<!DOCTYPE html>
<html lang="en">

<!-- This page is a trial of a code writing.  It does not have Responsive Design. -->

    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Abel2Dev">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Page | Terminal</title>
        <link rel="icon" href="RusticIcon800x800.png" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="navbar fixed-top navbar-translucent sm:navbar-expand fg-2" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="https://github.com/abel2dev">
                    <img src="../media/icon_sm.png" alt="Logo" width="24" height="24" class="d-inline-block align-text-top">
                    Abel2Dev
                </a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" href="../index.html">Example 1</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="../project_2/index.html">Example 2</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link disabled" aria-disabled="true">Example 3</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="https://mailchi.mp/166df327d4a3/abel2dev">Subscribe</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>

        <audio id="backgroundMusic" loop>
            <source src="cosmiccorral.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <main id="StartScreen">

            <div class="FullScreen">

                <div class="base-layer"></div>
                <div class="frame-layer"></div>
                
                <div id="airlock-splash">
                    <div class="door left-door">
                        <div class="tech-screen-container flicker-fast">
                            <div id="initializing-text">INITIALIZING... TAP TO OPEN</div>
                        </div>
                    </div>
                    <div class="door right-door"></div>
                </div>

                <div class="terminal-container" id="terminal-ui">
                    
                    <div class="center-display-stats flicker-fast" id="stats-bar">Current Players Online: 00000 | Current Games Running: 00000</div>

                    <div class="center-display page" id="page-start">
                        <a class="title-tab flicker-slow">Initializing</p>
                        <a class="center-display-button flicker-slow highlightable" href="#" onclick="return show('page-login')" >LOGIN</a>
                        <span class="separator flicker-fast">/</span>
                        <a class="center-display-button flicker-slow-reverse highlightable" href="#" onclick="return show('page-register')" >REGISTER</a>
                    </div>

                    <div class="center-display page" id="page-login">
                        <a class="title-tab flicker-slow">Welcome back</a>
                        <form> <!--- action="https://httpbin.org/get" method="get" -->
                            <fieldset>
                                <legend class="flicker-fast">LOGIN</legend>
                                <p class="center-display-small flicker-slow-reverse">
                                    <label for="username">Username</label>
                                    <input type="text" name="username" id="username" placeholder="Username" autocomplete="on" required autofocus>
                                </p>
                                <p class="center-display-small flicker-slow">
                                    <label for="password">Password:</label>
                                    <input type="password" name="password" id="password" placeholder="Password" required>
                                </p>
                                <button type="submit" disabled>Submit</button>
                                <button type="reset">Reset</button>
                            </fieldset>
                        </form>
                        <br>
                        <a href="#" onclick="return show('page-start');" class="center-display-button flicker-slow-reverse highlightable back-link">BACK</a>
                    </div>

                    <div class="center-display page" id="page-register">
                        <a class="title-tab flicker-slow">New account</a>
                        <form> <!--- action="https://httpbin.org/get" method="get" -->
                            <fieldset>
                                <legend class="flicker-fast">SIGN UP</legend>
                                <p class="center-display-small flicker-slow-reverse">
                                    <label for="username">Username</label>
                                    <input type="text" name="username" id="username" placeholder="Username" autocomplete="on" required autofocus>
                                </p>
                                <p class="center-display-small flicker-slow-reverse">
                                    <label for="email">Email</label>
                                    <input type="email" name="email" id="email" placeholder="Your Email" autocomplete="on" required >
                                </p>
                                <p class="center-display-small flicker-slow">
                                    <label for="password">Password:</label>
                                    <input type="password" name="password" id="password" placeholder="Password" required>
                                </p>
                                <button type="submit" disabled>Submit</button>
                                <button type="reset">Reset</button>
                            </fieldset>
                        </form>
                        <br>
                        <a href="#" onclick="return show('page-start');" class="center-display-button flicker-slow-reverse highlightable back-link">BACK</a>
                    </div>

                    <div class="plate-container">
                        <button class="plate-btn" id="archive-btn" data-sound="mech" >
                            <img src="TheArchiveButton.png" alt="Archive">
                        </button>
                        <button class="plate-btn" id="foundry-btn" data-sound="mech">
                            <img src="TheFoundryButton.png" alt="Foundry">
                        </button>
                        <button class="plate-btn" id="transmission-btn" data-sound="mech">
                            <img src="TransmissionHubButton.png" alt="Hub">
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
        <script src="scripts.js"></script>
    </body>
</html>
