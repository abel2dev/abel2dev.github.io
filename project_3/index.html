        <main>
            <hr id="nav-spacer">
            <div class="container">
                <h1 class="title">Shopping List</h1>
                <h2 class="sub">Get it done today</h2>
                <p class="instructions">
                    <em>Click</em> line item to cross it out.
                    <br>
                    <em>Double click</em> item to remove it from list.
                </p>
                <hr>
                <div class="list-input">
                    <input id="userinput" type="text" placeholder="enter items" aria-label="Add to shopping list">
                    <button id="enter" type="button">Add</button>
                </div>
                <div class="list-items">
                    <ul>
                        <li class="list-item">Notebook</li>
                        <li class="list-item">Jello</li>
                        <li class="list-item">Spinach</li>
                        <li class="list-item">Rice</li>
